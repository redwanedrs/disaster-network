; Disaster Network - root PlatformIO project
; All node firmware targets share the same common library.

[platformio]
default_envs = command-center

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_ldf_mode = chain+
lib_extra_dirs = firmware/common
lib_deps = sandeepmistry/LoRa@0.8.0
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Shared radio pins: chosen for a generic ESP32-S3-DevKitC-1 build.
; Adjust in firmware/common/include/disaster_config.h for your actual PCB.

[env:command-center]
src_dir = firmware/command-center/src
build_flags =
  ${env.build_flags}
  -DNODE_ID=1
  -DNODE_ROLE=1

[env:field-sensor-node]
src_dir = firmware/field-sensor-node/src
build_flags =
  ${env.build_flags}
  -DNODE_ID=10
  -DNODE_ROLE=2

[env:sos-panic-node]
src_dir = firmware/sos-panic-node/src
build_flags =
  ${env.build_flags}
  -DNODE_ID=20
  -DNODE_ROLE=3

[env:messaging-node]
src_dir = firmware/messaging-node/src
build_flags =
  ${env.build_flags}
  -DNODE_ID=30
  -DNODE_ROLE=4
